<meta charset="utf-8">
<title>Blattwerk PDF</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: app shell — top bar, tool strip, page thumbnails left, scrolling "desk" with white sheets, status bar */
:root {
  --bg: #eceef3;
  --panel: #ffffff;
  --line: #d6dae3;
  --fg: #1a1f2c;
  --muted: #5d6578;
  --accent: #2c52cf;
  --accent-fg: #ffffff;
  --accent-soft: #e2e8fb;
  --desk: #cfd4de;
  --danger: #c3362b;
  --shadow: 0 1px 2px rgba(20,28,50,.18), 0 6px 24px rgba(20,28,50,.14);
  --f-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-brand: "Space Grotesk", "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a23; --panel: #1d222d; --line: #2d3443; --fg: #e5e8f0; --muted: #98a0b4;
    --accent: #7d9bff; --accent-fg: #0e1430; --accent-soft: #243056; --desk: #0e1117; --danger: #ff7a6e;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 28px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161a23; --panel: #1d222d; --line: #2d3443; --fg: #e5e8f0; --muted: #98a0b4;
  --accent: #7d9bff; --accent-fg: #0e1430; --accent-soft: #243056; --desk: #0e1117; --danger: #ff7a6e;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 28px rgba(0,0,0,.45);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 14px; overflow: hidden; }
.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0,1fr) auto; }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* top bar */
.topbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--f-brand); font-weight: 700; font-size: 17px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; margin-right: 6px; }
.brand-mark { width: 22px; height: 26px; position: relative; }
.brand-mark::before, .brand-mark::after { content: ""; position: absolute; border-radius: 2px; }
.brand-mark::before { inset: 0 5px 5px 0; background: var(--accent-soft); border: 1.5px solid var(--accent); }
.brand-mark::after { inset: 5px 0 0 5px; background: var(--accent); }
.docname { color: var(--muted); font-size: 13px; max-width: 28ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line);
  background: var(--panel); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn.icon { width: 34px; padding: 0; justify-content: center; }
.group { display: inline-flex; align-items: center; gap: 4px; }
.zoomval { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }

/* tool strip */
.toolbar { display: flex; align-items: center; gap: 4px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto;
  padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tool { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; padding: 5px 6px; border-radius: 7px;
  border: 1px solid transparent; background: none; cursor: pointer; font-size: 11.5px; color: var(--muted); }
.tool:hover { background: var(--bg); color: var(--fg); }
.tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 8px; flex: none; }
.prop { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; padding: 0 4px; }
.prop input[type=color] { width: 30px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
.prop select { height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 0 4px; }
.prop input[type=range] { width: 80px; accent-color: var(--accent); }
.swatches { display: inline-flex; gap: 3px; }
.sw { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.tool.danger { color: var(--danger); }

/* main */
.main { display: grid; grid-template-columns: 168px minmax(0,1fr); min-height: 0; }
.thumbs { overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 14px 12px 14px max(12px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px; }
.thumb { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; border-radius: 8px; padding: 6px; border: 2px solid transparent; position: relative; }
.thumb:hover { background: var(--bg); }
.thumb.active { border-color: var(--accent); background: var(--accent-soft); }
.thumb.drop-before::before { content: ""; position: absolute; left: 4px; right: 4px; top: -9px; height: 3px; border-radius: 2px; background: var(--accent); }
.thumb.drop-after::after { content: ""; position: absolute; left: 4px; right: 4px; bottom: -9px; height: 3px; border-radius: 2px; background: var(--accent); }
.tbox { position: relative; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); overflow: hidden; }
.tbox img { position: absolute; left: 50%; top: 50%; display: block; max-width: none; }
.tnum { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.viewer { overflow: auto; background: var(--desk); position: relative; min-width: 0;
  padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.viewer.dragover { outline: 3px dashed var(--accent); outline-offset: -10px; }
#pages { display: flex; flex-direction: column; align-items: center; gap: 22px; width: max-content; min-width: 100%; }
.page-wrap { position: relative; flex: none; box-shadow: var(--shadow); background: #fff; }
.page-inner { position: absolute; left: 50%; top: 50%; transform-origin: center; }
.page-inner canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
svg.ov { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; touch-action: none; }
.t-select svg.ov { touch-action: pan-x pan-y; }
.t-select svg.ov .ann { cursor: move; touch-action: none; }
.t-text svg.ov { cursor: text; }
.t-ink svg.ov, .t-highlight svg.ov, .t-rect svg.ov, .t-whiteout svg.ov, .t-place svg.ov { cursor: crosshair; }
.page-wrap { user-select: none; -webkit-user-select: none; }
.textLayer { position: absolute; inset: 0; overflow: hidden; line-height: 1; text-size-adjust: none; forced-color-adjust: none; transform-origin: 0 0; pointer-events: none; }
.textLayer span, .textLayer br { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
.textLayer ::selection { background: rgba(44, 82, 207, .32); }
.textLayer .endOfContent { display: block; position: absolute; inset: 100% 0 0; z-index: -1; cursor: default; user-select: none; }
.t-textsel .page-wrap { user-select: text; -webkit-user-select: text; }
.t-textsel .textLayer { pointer-events: auto; }
.t-textsel svg.ov { pointer-events: none; }
.t-snap svg.ov { cursor: crosshair; }
.snapsel { fill: rgba(44, 82, 207, .08); stroke: var(--accent); stroke-dasharray: 5 3; pointer-events: none; }
.snapbar { position: fixed; z-index: 40; display: flex; gap: 6px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 6px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
.snapbar .btn { height: 30px; font-size: 12.5px; }
.page-label { position: absolute; top: 100%; right: 0; margin-top: 3px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sel { fill: none; stroke: var(--accent); stroke-dasharray: 4 3; pointer-events: none; }
.handle { fill: #fff; stroke: var(--accent); cursor: nwse-resize; }
.editbox { margin: 0; padding: 0; border: none; outline: 1.5px dashed var(--accent); background: rgba(255,255,255,.7); resize: none; overflow: hidden;
  width: 100%; height: 100%; box-sizing: border-box; white-space: pre; font-family: Helvetica, Arial, sans-serif; line-height: 1.2; }

/* status bar */
.status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--panel); border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted);
  padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.status .btn { height: 28px; padding: 0 9px; font-size: 12.5px; color: var(--fg); }
.pageno { font-variant-numeric: tabular-nums; color: var(--fg); font-weight: 500; }
.hint { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
kbd { font-family: var(--f-ui); font-size: 11px; padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }

/* modal + toast */
.modal { position: fixed; inset: 0; background: rgba(10,14,25,.55); display: grid; place-items: center; z-index: 50; padding: 16px; }
.card { background: var(--panel); border-radius: 12px; padding: 18px; width: min(560px, 100%); box-shadow: var(--shadow); display: grid; gap: 12px; }
.card h2 { margin: 0; font-family: var(--f-brand); font-size: 18px; }
.card p { margin: 0; color: var(--muted); font-size: 13px; }
.sigpad { width: 100%; aspect-ratio: 3 / 1; max-width: 100%; background: #fff; border-radius: 8px; border: 1px solid var(--line); touch-action: none; cursor: crosshair; position: relative; }
.sigpad canvas { width: 100%; height: 100%; display: block; }
.sigline { position: absolute; left: 8%; right: 8%; bottom: 24%; border-top: 1px solid #b8bfcc; pointer-events: none; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toast { position: fixed; left: 50%; bottom: calc(56px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg);
  padding: 9px 16px; border-radius: 8px; font-size: 13px; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }

@media (max-width: 760px) {
  .main { grid-template-columns: minmax(0,1fr); }
  .thumbs { display: none; }
  .docname, .hide-sm { display: none; }
  .tool { min-width: 54px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Blattwerk</div>
    <span class="docname" id="docname">Beispiel.pdf</span>
    <span class="spacer"></span>
    <button class="btn" id="btnOpen" title="PDF öffnen (Strg+O)"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><span>Öffnen</span></button>
    <button class="btn" id="btnAppend" title="Weitere PDF hinten anhängen"><svg class="i" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M12 12v6M9 15h6"/></svg><span class="hide-sm">PDF anhängen</span></button>
    <span class="group">
      <button class="btn icon" id="btnUndo" title="Rückgängig (Strg+Z)" aria-label="Rückgängig"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg></button>
      <button class="btn icon" id="btnRedo" title="Wiederholen (Strg+Y)" aria-label="Wiederholen"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg></button>
    </span>
    <span class="group">
      <button class="btn icon" id="btnZoomOut" title="Verkleinern" aria-label="Verkleinern"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <span class="zoomval" id="zoomval">100 %</span>
      <button class="btn icon" id="btnZoomIn" title="Vergrößern" aria-label="Vergrößern"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
      <button class="btn hide-sm" id="btnFit" title="An Fensterbreite anpassen">Breite</button>
    </span>
    <button class="btn primary" id="btnSave" title="Als PDF speichern (Strg+S)"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>Speichern</span></button>
  </header>

  <nav class="toolbar" aria-label="Werkzeuge">
    <button class="tool" data-tool="select" title="Auswählen & verschieben (V)"><svg class="i" viewBox="0 0 24 24"><path d="M6 3l12 9-5.5 1.2L15 20l-2.6 1.1-2.6-6.6L6 18z"/></svg>Auswahl</button>
    <button class="tool" data-tool="textsel" title="Text in der PDF markieren und kopieren (I)"><svg class="i" viewBox="0 0 24 24"><path d="M9 4h6M9 20h6M12 4v16"/><path d="M4 9h3M4 15h3M17 9h3M17 15h3"/></svg>Text wählen</button>
    <button class="tool" data-tool="snap" title="Bereich als Bild kopieren (K)"><svg class="i" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3"/><circle cx="12" cy="12" r="3"/></svg>Schnappschuss</button>
    <span class="sep"></span>
    <button class="tool" data-tool="text" title="Text einfügen (T)"><svg class="i" viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></svg>Text</button>
    <button class="tool" data-tool="ink" title="Freihand zeichnen (D)"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg>Zeichnen</button>
    <button class="tool" data-tool="highlight" title="Markieren (H)"><svg class="i" viewBox="0 0 24 24"><path d="M9 14l-3 3v2h4l3-3"/><path d="M9 14l7-7 3 3-7 7z"/><path d="M3 21h9"/></svg>Markieren</button>
    <button class="tool" data-tool="rect" title="Rechteck (R)"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>Rechteck</button>
    <button class="tool" data-tool="whiteout" title="Bereich weiß abdecken (W)"><svg class="i" viewBox="0 0 24 24"><path d="M4 15l8-8 7 7-5 5H8z"/><path d="M9 10l6 6M3 21h18"/></svg>Abdecken</button>
    <button class="tool" id="btnImage" title="Bild einfügen"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>Bild</button>
    <button class="tool" id="btnSign" title="Unterschrift zeichnen und einfügen"><svg class="i" viewBox="0 0 24 24"><path d="M3 16c2.5 0 3.5-8 6-8s.5 8 3.5 8 2.5-4 4.5-4 1.5 2 4 2"/><path d="M3 20h18"/></svg>Signieren</button>
    <span class="sep"></span>
    <label class="prop" title="Farbe"><span>Farbe</span>
      <span class="swatches" id="swatches"></span>
      <input type="color" id="pColor" value="#d0342c" aria-label="Eigene Farbe">
    </label>
    <label class="prop" title="Schriftgröße in Punkt"><span>Schrift</span>
      <select id="pSize"><option>8</option><option>10</option><option>11</option><option>12</option><option>14</option><option selected>16</option><option>20</option><option>24</option><option>32</option><option>48</option></select>
    </label>
    <label class="prop" title="Strichstärke in Punkt"><span>Strich</span><input type="range" id="pWidth" min="0.5" max="12" step="0.5" value="2.5"></label>
    <span class="sep"></span>
    <button class="tool" id="btnCopyAnn" title="Ausgewähltes Element kopieren (Strg+C), einfügen mit Strg+V" disabled><svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 00-2-2H6a2 2 0 00-2 2v11a2 2 0 002 2h2"/></svg>Kopieren</button>
    <button class="tool danger" id="btnDelAnn" title="Ausgewähltes Element löschen (Entf)" disabled><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Entfernen</button>
  </nav>

  <div class="main">
    <aside class="thumbs" id="thumbs" aria-label="Seitenübersicht"></aside>
    <section class="viewer t-select" id="viewer">
      <div id="pages"></div>
      <div class="loading" id="loading">Dokument wird geladen …</div>
    </section>
  </div>

  <footer class="status">
    <span class="pageno" id="pageno">Seite – von –</span>
    <span class="group">
      <button class="btn" id="btnRotL" title="Seite nach links drehen"><svg class="i" viewBox="0 0 24 24"><path d="M4 4v5h5"/><path d="M4.6 9A8 8 0 1112 20"/></svg><span class="hide-sm">Links</span></button>
      <button class="btn" id="btnRotR" title="Seite nach rechts drehen"><svg class="i" viewBox="0 0 24 24"><path d="M20 4v5h-5"/><path d="M19.4 9A8 8 0 1012 20"/></svg><span class="hide-sm">Rechts</span></button>
      <button class="btn" id="btnBlank" title="Leere Seite nach der aktuellen einfügen"><svg class="i" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6"/></svg><span class="hide-sm">Leere Seite</span></button>
      <button class="btn" id="btnDup" title="Aktuelle Seite duplizieren"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 00-2-2H6a2 2 0 00-2 2v11a2 2 0 002 2h2"/></svg><span class="hide-sm">Duplizieren</span></button>
      <button class="btn" id="btnDelPage" title="Aktuelle Seite löschen"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span class="hide-sm">Seite löschen</span></button>
    </span>
    <span class="hint" id="hint"></span>
  </footer>
</div>

<div class="modal" id="sigModal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="sigTitle">
    <h2 id="sigTitle">Unterschrift</h2>
    <p>Mit Maus, Stift oder Finger auf der Linie unterschreiben. Danach auf die Seite klicken, um sie zu platzieren.</p>
    <div class="sigpad" id="sigpad"><canvas id="sigCanvas"></canvas><div class="sigline"></div></div>
    <div class="row">
      <label class="prop">Farbe
        <select id="sigColor"><option value="#1b2a6b">Blau</option><option value="#111111">Schwarz</option></select>
      </label>
      <span class="spacer"></span>
      <button class="btn" id="sigClear">Leeren</button>
      <button class="btn" id="sigCancel">Abbrechen</button>
      <button class="btn primary" id="sigOk">Übernehmen</button>
    </div>
  </div>
</div>

<div class="snapbar" id="snapbar" hidden>
  <button class="btn primary" id="snapCopy">Bild kopieren</button>
  <button class="btn" id="snapPlace">Als Bild einfügen</button>
  <button class="btn" id="snapSave">Als PNG speichern</button>
  <button class="btn icon" id="snapClose" aria-label="Schließen" title="Schließen (Esc)">✕</button>
</div>

<input type="file" id="fileOpen" accept="application/pdf,.pdf" hidden>
<input type="file" id="fileAppend" accept="application/pdf,.pdf" hidden>
<input type="file" id="fileImage" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(() => {
'use strict';
const { PDFDocument, rgb, degrees, StandardFonts, LineCapStyle, BlendMode } = PDFLib;
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const $ = id => document.getElementById(id);
const viewer = $('viewer'), pagesEl = $('pages'), thumbsEl = $('thumbs');
const SWATCHES = ['#d0342c', '#1b2a6b', '#111111', '#1f7a3a', '#f2c200', '#e2711d'];

const S = {
  sources: [], pages: [], images: {},
  tool: 'select', scale: 1, fileName: 'Beispiel.pdf',
  props: { color: '#d0342c', size: 16, width: 2.5 },
  selected: null, current: null, editing: null, pending: null,
  undo: [], redo: []
};
let nid = 0;
const uid = () => 'x' + (++nid).toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r1 = v => Math.round(v * 10) / 10;
const pageById = id => S.pages.find(p => p.id === id);
const wrapOf = id => pagesEl.querySelector(`.page-wrap[data-id="${id}"]`);

/* ---------- toast ---------- */
let toastT;
function toast(msg, ms = 2600) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms);
}

/* ---------- text measuring ---------- */
const mctx = document.createElement('canvas').getContext('2d');
function measure(text, size) { mctx.font = `${size}px Helvetica, Arial, sans-serif`; return mctx.measureText(text).width; }

/* ---------- history ---------- */
function snapshot() { return JSON.stringify(S.pages); }
function pushHistory() { S.undo.push(snapshot()); if (S.undo.length > 100) S.undo.shift(); S.redo = []; updateUI(); }
function restore(json) { S.pages = JSON.parse(json); S.selected = null; S.editing = null; layout(); }
function undo() { if (S.editing) commitEdit(); if (!S.undo.length) return; S.redo.push(snapshot()); restore(S.undo.pop()); }
function redo() { if (!S.redo.length) return; S.undo.push(snapshot()); restore(S.redo.pop()); }

/* ---------- loading documents ---------- */
async function addSource(bytes) {
  const data = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  const doc = await pdfjsLib.getDocument({ data: data.slice() }).promise;
  S.sources.push({ bytes: data, doc, lib: null });
  const si = S.sources.length - 1, out = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const p = await doc.getPage(i);
    const [x0, y0, x1, y1] = p.view;
    out.push({ id: uid(), src: si, idx: i - 1, rotation: p.rotate || 0, w: x1 - x0, h: y1 - y0, anns: [] });
  }
  return out;
}

async function openBytes(bytes, name, append) {
  $('loading').hidden = false;
  try {
    const pages = await addSource(bytes);
    if (append) {
      pushHistory();
      S.pages.push(...pages);
      layout();
      toast(`${pages.length} Seite${pages.length === 1 ? '' : 'n'} angehängt`);
      scrollToPage(pages[0].id);
    } else {
      S.pages = pages; S.undo = []; S.redo = []; S.selected = null; S.editing = null;
      S.fileName = name || 'Dokument.pdf'; $('docname').textContent = S.fileName;
      viewer.scrollTop = 0;
      fitWidth(true);
      layout();
    }
  } catch (err) {
    console.error(err);
    toast(err && err.name === 'PasswordException'
      ? 'Diese PDF ist passwortgeschützt und kann nicht geöffnet werden.'
      : 'Die Datei konnte nicht als PDF gelesen werden.', 4000);
  } finally { $('loading').hidden = true; }
}

async function readFile(file, append) {
  if (!file) return;
  if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) { toast('Bitte eine PDF-Datei wählen.'); return; }
  const buf = await file.arrayBuffer();
  openBytes(new Uint8Array(buf), file.name, append);
}

/* ---------- layout & rendering ---------- */
const canvasCache = new Map();   // pageKey -> {canvas, scale}
const pageKey = p => p.src + ':' + p.idx;
const visible = new Set();
const io = new IntersectionObserver(entries => {
  for (const en of entries) {
    const id = en.target.dataset.id;
    if (en.isIntersecting) { visible.add(id); const p = pageById(id); if (p) { renderCanvas(p, en.target); buildTextLayer(p, en.target); } }
    else visible.delete(id);
  }
}, { root: viewer, rootMargin: '800px 0px' });

function dims(p) { const rot = p.rotation % 180 !== 0; return { w: (rot ? p.h : p.w) * S.scale, h: (rot ? p.w : p.h) * S.scale }; }

function setSizes(wrap, p) {
  const d = dims(p);
  wrap.style.width = d.w + 'px'; wrap.style.height = d.h + 'px';
  const inner = wrap.firstElementChild;
  inner.style.width = p.w * S.scale + 'px'; inner.style.height = p.h * S.scale + 'px';
  inner.style.transform = `translate(-50%,-50%) rotate(${p.rotation}deg)`;
  const tl = inner.querySelector('.textLayer');
  if (tl) tl.style.setProperty('--scale-factor', S.scale);
}

async function buildTextLayer(p, wrap) {
  const tl = wrap.querySelector('.textLayer');
  if (!tl || tl.dataset.done) return;
  tl.dataset.done = '1';
  try {
    const page = await S.sources[p.src].doc.getPage(p.idx + 1);
    const vp = page.getViewport({ scale: 1, rotation: 0 });
    tl.style.setProperty('--scale-factor', S.scale);
    await pdfjsLib.renderTextLayer({ textContentSource: page.streamTextContent(), container: tl, viewport: vp, textDivs: [] }).promise;
    tl.style.width = ''; tl.style.height = '';
  } catch (e) { console.warn(e); }
}

function layout() {
  io.disconnect(); visible.clear();
  pagesEl.textContent = '';
  S.pages.forEach((p, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'page-wrap'; wrap.dataset.id = p.id;
    const inner = document.createElement('div'); inner.className = 'page-inner';
    const cached = canvasCache.get(pageKey(p));
    if (cached) inner.appendChild(cached.canvas.cloneNode(false)).getContext('2d').drawImage(cached.canvas, 0, 0);
    else inner.appendChild(document.createElement('canvas'));
    const tl = document.createElement('div'); tl.className = 'textLayer';
    inner.appendChild(tl);
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'ov'); svg.setAttribute('viewBox', `0 0 ${p.w} ${p.h}`);
    inner.appendChild(svg);
    wrap.appendChild(inner);
    const lab = document.createElement('div'); lab.className = 'page-label'; lab.textContent = `${i + 1} / ${S.pages.length}`;
    wrap.appendChild(lab);
    setSizes(wrap, p);
    pagesEl.appendChild(wrap);
    renderAnns(p);
    io.observe(wrap);
  });
  if (!pageById(S.current)) S.current = S.pages[0] && S.pages[0].id;
  renderThumbs();
  updateUI();
}

const pending = new Map();
async function renderCanvas(p, wrap) {
  const key = pageKey(p);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const want = S.scale * dpr;
  const cached = canvasCache.get(key);
  const current = wrap.querySelector('canvas');
  if (cached && cached.scale === want) {
    if (current.width !== cached.canvas.width) { const c = cached.canvas.cloneNode(false); c.getContext('2d').drawImage(cached.canvas, 0, 0); current.replaceWith(c); }
    return;
  }
  const tag = key + '@' + want;
  if (pending.has(tag)) { await pending.get(tag); return renderCanvas(p, wrap); }
  const job = (async () => {
    const page = await S.sources[p.src].doc.getPage(p.idx + 1);
    const vp = page.getViewport({ scale: want, rotation: 0 });
    const c = document.createElement('canvas');
    c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    canvasCache.set(key, { canvas: c, scale: want });
  })();
  pending.set(tag, job);
  try { await job; } catch (e) { console.warn(e); return; } finally { pending.delete(tag); }
  if (Math.min(window.devicePixelRatio || 1, 2) * S.scale !== want) return;
  pagesEl.querySelectorAll('.page-wrap').forEach(w => {
    const pp = pageById(w.dataset.id);
    if (pp && pageKey(pp) === key) {
      const c = canvasCache.get(key).canvas.cloneNode(false);
      c.getContext('2d').drawImage(canvasCache.get(key).canvas, 0, 0);
      w.querySelector('canvas').replaceWith(c);
    }
  });
}

/* ---------- annotations: SVG ---------- */
function annBox(a) {
  if (a.type === 'text') {
    const lines = a.text.split('\n');
    return { x: a.x, y: a.y, w: Math.max(a.size * 0.6, ...lines.map(l => measure(l, a.size))), h: lines.length * a.size * 1.2 };
  }
  if (a.type === 'ink') {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [x, y] of a.points) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    const pd = a.width / 2 + 2;
    return { x: x0 - pd, y: y0 - pd, w: x1 - x0 + pd * 2, h: y1 - y0 + pd * 2 };
  }
  return { x: a.x, y: a.y, w: a.w, h: a.h };
}
const inkPath = pts => pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ');

function annSVG(a, selected) {
  const u = 1 / S.scale;
  let body = '';
  switch (a.type) {
    case 'highlight': body = `<rect x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" fill="${a.color}" fill-opacity="0.38" style="mix-blend-mode:multiply"/>`; break;
    case 'whiteout': body = `<rect x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" fill="#ffffff"/>`; break;
    case 'rect': body = `<rect x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" fill="transparent" stroke="${a.color}" stroke-width="${a.width}"/>`; break;
    case 'ink': {
      const d = inkPath(a.points);
      body = `<path d="${d}" fill="none" stroke="transparent" stroke-width="${Math.max(a.width, 10 * u)}" stroke-linecap="round"/>` +
             `<path d="${d}" fill="none" stroke="${a.color}" stroke-width="${a.width}" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>`;
      break;
    }
    case 'image': body = `<image href="${S.images[a.img] ? S.images[a.img].url : ''}" x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" preserveAspectRatio="none"/>`; break;
    case 'text': {
      if (S.editing && S.editing.ann.id === a.id) return '';
      const b = annBox(a);
      const tsp = a.text.split('\n').map((l, i) =>
        `<tspan x="${a.x}" y="${r1(a.y + a.size * 0.8 + i * a.size * 1.2)}">${esc(l) || ' '}</tspan>`).join('');
      body = `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="transparent"/>` +
             `<text font-family="Helvetica, Arial, sans-serif" font-size="${a.size}" fill="${a.color}" style="white-space:pre">${tsp}</text>`;
      break;
    }
  }
  let sel = '';
  if (selected) {
    const b = annBox(a), pd = 3 * u;
    sel = `<rect class="sel" x="${b.x - pd}" y="${b.y - pd}" width="${b.w + pd * 2}" height="${b.h + pd * 2}" stroke-width="${1.2 * u}"/>`;
    if (/^(rect|highlight|whiteout|image)$/.test(a.type))
      sel += `<circle class="handle" data-handle="1" cx="${a.x + a.w}" cy="${a.y + a.h}" r="${6 * u}" stroke-width="${1.5 * u}"/>`;
  }
  const tf = a.type === 'text' && a.angle ? ` transform="rotate(${-a.angle} ${a.x} ${a.y})"` : '';
  return `<g class="ann" data-id="${a.id}"${tf}>${body}${sel}</g>`;
}

function renderAnns(p) {
  const wrap = wrapOf(p.id); if (!wrap) return;
  const svg = wrap.querySelector('svg.ov');
  const selId = S.selected && S.selected.pageId === p.id ? S.selected.annId : null;
  const keepFo = svg.querySelector('foreignObject');
  svg.innerHTML = p.anns.map(a => annSVG(a, a.id === selId)).join('') +
    (S.snap && S.snap.pageId === p.id ? `<rect class="snapsel" x="${S.snap.x}" y="${S.snap.y}" width="${S.snap.w}" height="${S.snap.h}" stroke-width="${1.4 / S.scale}"/>` : '');
  if (keepFo && S.editing && S.editing.page.id === p.id) svg.appendChild(keepFo);
}

/* ---------- thumbnails ---------- */
const thumbUrl = new Map();
let thumbChain = Promise.resolve();
function thumbFor(p, img) {
  const key = pageKey(p);
  if (thumbUrl.has(key)) { img.src = thumbUrl.get(key); return; }
  thumbChain = thumbChain.then(async () => {
    if (!thumbUrl.has(key)) {
      const page = await S.sources[p.src].doc.getPage(p.idx + 1);
      const vp = page.getViewport({ scale: 240 / Math.max(p.w, p.h), rotation: 0 });
      const c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      thumbUrl.set(key, c.toDataURL('image/png'));
    }
    thumbsEl.querySelectorAll(`img[data-key="${key}"]`).forEach(i => { i.src = thumbUrl.get(key); });
  }).catch(e => console.warn(e));
}

function renderThumbs() {
  thumbsEl.textContent = '';
  const T = 116;
  S.pages.forEach((p, i) => {
    const rot = p.rotation % 180 !== 0;
    const dw = rot ? p.h : p.w, dh = rot ? p.w : p.h;
    const k = T / Math.max(dw, dh);
    const el = document.createElement('div');
    el.className = 'thumb' + (p.id === S.current ? ' active' : '');
    el.draggable = true; el.dataset.id = p.id; el.title = 'Ziehen zum Umsortieren';
    el.innerHTML = `<div class="tbox" style="width:${dw * k}px;height:${dh * k}px"><img alt="" data-key="${pageKey(p)}" style="width:${p.w * k}px;height:${p.h * k}px;transform:translate(-50%,-50%) rotate(${p.rotation}deg)"></div><span class="tnum">${i + 1}</span>`;
    thumbFor(p, el.querySelector('img'));
    thumbsEl.appendChild(el);
  });
}

let dragThumb = null;
thumbsEl.addEventListener('click', e => { const t = e.target.closest('.thumb'); if (t) scrollToPage(t.dataset.id); });
thumbsEl.addEventListener('dragstart', e => { const t = e.target.closest('.thumb'); if (!t) return; dragThumb = t.dataset.id; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragThumb); });
thumbsEl.addEventListener('dragover', e => {
  if (!dragThumb) return; e.preventDefault();
  thumbsEl.querySelectorAll('.drop-before,.drop-after').forEach(n => n.classList.remove('drop-before', 'drop-after'));
  const t = e.target.closest('.thumb'); if (!t) return;
  const r = t.getBoundingClientRect();
  t.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
});
thumbsEl.addEventListener('dragend', () => { dragThumb = null; thumbsEl.querySelectorAll('.drop-before,.drop-after').forEach(n => n.classList.remove('drop-before', 'drop-after')); });
thumbsEl.addEventListener('drop', e => {
  e.preventDefault();
  const t = e.target.closest('.thumb'); if (!t || !dragThumb || t.dataset.id === dragThumb) return;
  const after = t.classList.contains('drop-after');
  const from = S.pages.findIndex(p => p.id === dragThumb);
  pushHistory();
  const [moved] = S.pages.splice(from, 1);
  let to = S.pages.findIndex(p => p.id === t.dataset.id) + (after ? 1 : 0);
  S.pages.splice(to, 0, moved);
  S.current = moved.id; dragThumb = null;
  layout(); scrollToPage(moved.id);
});

/* ---------- navigation / zoom ---------- */
function scrollToPage(id) { const w = wrapOf(id); if (!w) return; S.current = id; viewer.scrollTo({ top: w.offsetTop - 16, behavior: 'smooth' }); markCurrent(); }
function markCurrent() {
  thumbsEl.querySelectorAll('.thumb').forEach(t => t.classList.toggle('active', t.dataset.id === S.current));
  const i = S.pages.findIndex(p => p.id === S.current);
  $('pageno').textContent = `Seite ${i + 1} von ${S.pages.length}`;
  const at = thumbsEl.querySelector('.thumb.active');
  if (at) { const r = at.getBoundingClientRect(), rr = thumbsEl.getBoundingClientRect(); if (r.top < rr.top || r.bottom > rr.bottom) at.scrollIntoView({ block: 'nearest' }); }
}
let scrollRaf = 0;
viewer.addEventListener('scroll', () => {
  if (scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => {
    scrollRaf = 0;
    const top = viewer.getBoundingClientRect().top + viewer.clientHeight * 0.3;
    let best = null;
    for (const w of pagesEl.children) { const r = w.getBoundingClientRect(); if (r.top <= top) best = w.dataset.id; else break; }
    best = best || (S.pages[0] && S.pages[0].id);
    if (best !== S.current) { S.current = best; markCurrent(); }
  });
});

function setScale(s, keepAnchor = true) {
  s = Math.max(0.25, Math.min(4, s));
  const ratioY = viewer.scrollTop / Math.max(1, viewer.scrollHeight);
  S.scale = s;
  $('zoomval').textContent = Math.round(s * 100) + ' %';
  pagesEl.querySelectorAll('.page-wrap').forEach(w => { const p = pageById(w.dataset.id); setSizes(w, p); renderAnns(p); });
  if (keepAnchor) viewer.scrollTop = ratioY * viewer.scrollHeight;
  clearTimeout(setScale.t);
  setScale.t = setTimeout(() => visible.forEach(id => { const p = pageById(id), w = wrapOf(id); if (p && w) renderCanvas(p, w); }), 120);
}
function fitWidth(silent) {
  if (!S.pages.length) return;
  const maxW = Math.max(...S.pages.map(p => (p.rotation % 180 ? p.h : p.w)));
  const avail = viewer.clientWidth - 48;
  const s = Math.min(silent ? 1.5 : 4, avail / maxW);
  if (silent) { S.scale = Math.max(0.25, s); $('zoomval').textContent = Math.round(S.scale * 100) + ' %'; }
  else setScale(s, false);
}
const ZSTEPS = [0.25, 0.33, 0.5, 0.67, 0.75, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3, 4];
function zoomStep(dir) {
  const s = S.scale;
  const next = dir > 0 ? ZSTEPS.find(z => z > s + 0.001) : [...ZSTEPS].reverse().find(z => z < s - 0.001);
  if (next) setScale(next);
}

/* ---------- tools ---------- */
const HINTS = {
  select: 'Element anklicken zum Auswählen, ziehen zum Verschieben. Doppelklick auf Text bearbeitet ihn. Strg+C / Strg+V kopiert Elemente, Strg+V fügt auch Bilder und Text aus der Zwischenablage ein.',
  textsel: 'Text in der PDF mit der Maus markieren und mit Strg+C kopieren.',
  snap: 'Rahmen um einen Bereich ziehen. Er wird als Bild kopiert und kann gespeichert oder wieder eingefügt werden.',
  text: 'Auf die Seite klicken und tippen. Tipp: Erst mit „Abdecken“ alten Text überdecken, dann neu schreiben.',
  ink: 'Mit gedrückter Maustaste auf der Seite zeichnen.',
  highlight: 'Rechteck über die Textstelle ziehen, um sie zu markieren.',
  rect: 'Rechteck aufziehen.',
  whiteout: 'Bereich aufziehen, der weiß überdeckt werden soll. Der Inhalt darunter bleibt in der Datei erhalten.',
  place: 'Auf die Seite klicken, um das Bild zu platzieren. Esc bricht ab.'
};
function setTool(t) {
  if (S.editing) commitEdit();
  S.tool = t;
  if (t !== 'place') S.pending = null;
  if (t !== 'textsel') { const sel = window.getSelection(); if (sel && !sel.isCollapsed && sel.anchorNode && pagesEl.contains(sel.anchorNode)) sel.removeAllRanges(); }
  clearSnap();
  document.querySelectorAll('.tool[data-tool]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tool === t)));
  viewer.className = 'viewer t-' + t;
  $('hint').innerHTML = esc(HINTS[t] || '');
  if (t !== 'select' && S.selected) { const p = pageById(S.selected.pageId); S.selected = null; if (p) renderAnns(p); }
  updateUI();
}
document.querySelectorAll('.tool[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));

function selectedAnn() {
  if (!S.selected) return null;
  const p = pageById(S.selected.pageId); if (!p) return null;
  const a = p.anns.find(x => x.id === S.selected.annId);
  return a ? { p, a } : null;
}
function select(p, a) {
  const prev = S.selected && pageById(S.selected.pageId);
  S.selected = a ? { pageId: p.id, annId: a.id } : null;
  if (prev && prev !== p) renderAnns(prev);
  if (p) renderAnns(p);
  if (a) syncProps(a);
  updateUI();
}
function syncProps(a) {
  if (a.color) { $('pColor').value = a.color; S.props.color = a.color; }
  if (a.type === 'text') { $('pSize').value = String(a.size); if ($('pSize').value !== String(a.size)) { const o = new Option(a.size); $('pSize').add(o); $('pSize').value = String(a.size); } S.props.size = a.size; }
  if (a.width) { $('pWidth').value = a.width; S.props.width = a.width; }
}
function deleteSelected() {
  const s = selectedAnn(); if (!s) return;
  pushHistory();
  s.p.anns = s.p.anns.filter(x => x !== s.a);
  S.selected = null; renderAnns(s.p); updateUI();
}

/* property controls */
const swEl = $('swatches');
SWATCHES.forEach(c => { const b = document.createElement('button'); b.type = 'button'; b.className = 'sw'; b.style.background = c; b.title = c; b.setAttribute('aria-label', 'Farbe ' + c); b.addEventListener('click', e => { e.preventDefault(); applyProp('color', c); $('pColor').value = c; }); swEl.appendChild(b); });
let propPushed = false;
function applyProp(k, v) {
  S.props[k] = v;
  const s = selectedAnn();
  if (!s) return;
  const a = s.a;
  if (k === 'color' && a.type === 'whiteout') return;
  if (k === 'size' && a.type !== 'text') return;
  if (k === 'width' && !(a.type === 'ink' || a.type === 'rect')) return;
  if (!propPushed) { pushHistory(); propPushed = true; }
  a[k] = v; renderAnns(s.p);
}
$('pColor').addEventListener('input', e => applyProp('color', e.target.value));
$('pColor').addEventListener('change', () => { propPushed = false; });
$('pSize').addEventListener('change', e => { applyProp('size', +e.target.value); propPushed = false; });
$('pWidth').addEventListener('input', e => applyProp('width', +e.target.value));
$('pWidth').addEventListener('change', () => { propPushed = false; });
swEl.addEventListener('click', () => { propPushed = false; });

/* ---------- pointer interaction on pages ---------- */
function toPage(svg, e) {
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const m = svg.getScreenCTM(); const r = pt.matrixTransform(m.inverse());
  return { x: r1(r.x), y: r1(r.y) };
}
let drag = null;
pagesEl.addEventListener('pointerdown', e => {
  const svg = e.target.closest('svg.ov'); if (!svg || e.button !== 0) return;
  if (e.target.closest('foreignObject')) return;
  const wrap = svg.closest('.page-wrap'); const p = pageById(wrap.dataset.id);
  S.current = p.id; markCurrent();
  clearSnap();
  if (S.editing) { const wasText = S.tool === 'text'; commitEdit(); if (wasText) { e.preventDefault(); return; } }
  const pt = toPage(svg, e);
  const t = S.tool;

  if (t === 'select') {

    const L = box.x, T = box.y + box.height;
    for (const a of p.anns) {
      if (a.type === 'highlight') pg.drawRectangle({ x: L + a.x, y: T - a.y - a.h, width: a.w, height: a.h, color: hexRgb(a.color), opacity: 0.38, blendMode: BlendMode.Multiply });
      else if (a.type === 'whiteout') pg.drawRectangle({ x: L + a.x, y: T - a.y - a.h, width: a.w, height: a.h, color: rgb(1, 1, 1) });
      else if (a.type === 'rect') pg.drawRectangle({ x: L + a.x, y: T - a.y - a.h, width: a.w, height: a.h, borderColor: hexRgb(a.color), borderWidth: a.width });
      else if (a.type === 'ink') pg.drawSvgPath(inkPath(a.points), { x: L, y: T, borderColor: hexRgb(a.color), borderWidth: a.width, borderLineCap: LineCapStyle.Round });
      else if (a.type === 'image') {
        const im = S.images[a.img]; if (!im) continue;
        if (!embedded[a.img]) embedded[a.img] = im.url.startsWith('data:image/jpeg') ? await out.embedJpg(im.url) : await out.embedPng(im.url);
        pg.drawImage(embedded[a.img], { x: L + a.x, y: T - a.y - a.h, width: a.w, height: a.h });
      } else if (a.type === 'text') {
        const th = -(a.angle || 0) * Math.PI / 180;
        a.text.split('\n').forEach((line, i) => {
          if (!line) return;
          const d = a.size * 0.8 + i * a.size * 1.2;
          const dx = -d * Math.sin(th), dy = d * Math.cos(th);
          pg.drawText(clean(line), { x: L + a.x + dx, y: T - (a.y + dy), size: a.size, font, color: hexRgb(a.color), rotate: degrees(a.angle || 0) });
        });
      }
    }
  }
  return out.save();
}

async function save() {
  if (S.editing) commitEdit();
  const btn = $('btnSave'); btn.disabled = true;
  const label = btn.querySelector('span'); label.textContent = 'Erstelle …';
  try {
    const bytes = await exportPdf();
    const name = S.fileName.replace(/\.pdf$/i, '') + '-bearbeitet.pdf';
    await saveBlob(name, new Blob([bytes], { type: 'application/pdf' }));
  } catch (err) {
    console.error(err);
    toast('Die PDF konnte nicht erstellt werden: ' + (err && err.message ? err.message : err), 5000);
  } finally { btn.disabled = false; label.textContent = 'Speichern'; }
}

$('fileAppend').addEventListener('change', e => { readFile(e.target.files[0], true); e.target.value = ''; });

viewer.addEventListener('dragover', e => { if (dragThumb) return; if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); viewer.classList.add('dragover'); } });
viewer.addEventListener('dragleave', e => { if (e.target === viewer) viewer.classList.remove('dragover'); });
viewer.addEventListener('drop', e => {
  viewer.classList.remove('dragover');
  const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (!f) return;
  e.preventDefault(); readFile(f, false);
});
viewer.addEventListener('wheel', e => { if (e.ctrlKey) { e.preventDefault(); zoomStep(e.deltaY < 0 ? 1 : -1); } }, { passive: false });

document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select') || !$('sigModal').hidden) { if (e.key === 'Escape') $('sigModal').hidden = true; return; }
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  else if (mod && e.key.toLowerCase() === 'o') { e.preventDefault(); $('fileOpen').click(); }
  else if (mod) return;
  else if (e.key === 'Delete' || e.key === 'Backspace') { if (S.selected) { e.preventDefault(); deleteSelected(); } }
  else if (e.key === 'Escape' && !$('snapbar').hidden) clearSnap();
  else if (e.key === 'Escape') { if (S.tool === 'place') setTool('select'); else if (S.selected) select(pageById(S.selected.pageId), null); }
  else {
    const map = { v: 'select', i: 'textsel', k: 'snap', t: 'text', d: 'ink', h: 'highlight', r: 'rect', w: 'whiteout' };
    const t = map[e.key.toLowerCase()]; if (t) setTool(t);
  }
});
let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => visible.forEach(id => { const p = pageById(id), w = wrapOf(id); if (p && w) renderCanvas(p, w); }), 200); });
